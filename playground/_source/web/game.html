<!DOCTYPE html>
<!-- The page inside the playground's game iframe. It is a copy of Karl2D's
     web build template (build_web/web_entry_templates/index_template.html)
     that gets the wasm module from the playground page instead of fetching
     it. A fresh iframe is created for every run so that nothing the previous
     program left behind (event listeners, WebGL state, audio) lingers. -->
<html lang="en" style="height: 100%;">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Karl2D Playground Game</title>
		<link id="karl2d-favicon" rel="icon" href="">
	</head>
	<body id="body" style="height: 100%; padding: 0; margin: 0; overflow: hidden; background-color: black;">
		<!-- tabindex so that the page can hand it the focus after a run -->
		<canvas id="webgl-canvas" tabindex="0" style="touch-action: none; outline: none;" oncontextmenu="return false;" onmousedown="event.target.focus()"></canvas>

		<script type="text/javascript" src="audio_backend_web_audio.js?version=%%"></script>
		<script type="text/javascript" src="odin.js?version=%%"></script>
		<script type="text/javascript">
			// The keys whose usual browser behaviour would get in the way of a
			// game: moving the focus out of the canvas, scrolling the page.
			//
			// Only keys that are not text are in here. Cancelling a keydown
			// also cancels the keypress that would have followed it, and a
			// keypress is where a typed character comes from, so taking every
			// key away from the browser makes `k2.get_typed_runes` return
			// nothing and a text field in a program impossible to type in.
			// Combinations with ctrl, meta or alt are left alone as well, so
			// that reloading and the developer tools still work.
			const KEYS_FOR_THE_GAME = new Set([
				"Tab", "Backspace", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight",
				"PageUp", "PageDown", "Home", "End",
			]);
			window.addEventListener("keydown", (event) => {
				if (!event.ctrlKey && !event.metaKey && !event.altKey && KEYS_FOR_THE_GAME.has(event.key)) {
					event.preventDefault();
				}
			});

			function report(message) {
				window.parent.postMessage({type: "game", text: message}, "*");
			}

			function crashed(error) {
				report("Program crashed: " + error + "\n" + (error && error.stack ? error.stack + "\n" : ""));
				window.parent.postMessage({type: "game-crashed"}, "*");
			}

			async function run(file) {
				const wasmMemoryInterface = new odin.WasmMemoryInterface();
				wasmMemoryInterface.setIntSize(4);

				let imports = odin.setupDefaultImports(wasmMemoryInterface, null, wasmMemoryInterface.memory);
				imports = { ...imports, ...karl2dAudioJsImports };
				const write = imports.odin_env.write;
				imports.odin_env.write = (fd, ptr, len) => {
					report(wasmMemoryInterface.loadString(ptr, len));
				};

				const wasm = await WebAssembly.instantiate(file, imports);
				const exports = wasm.instance.exports;
				wasmMemoryInterface.setExports(exports);

				if (exports.memory) {
					wasmMemoryInterface.setMemory(exports.memory);
					setKarl2dAudioWasmMemory(exports.memory);
				}

				if (exports._start) {
					exports._start();
				}

				if (exports.step) {
					const odin_ctx = exports.default_context_ptr();

					let prevTimeStamp = undefined;
					function step(currTimeStamp) {
						if (prevTimeStamp == undefined) {
							prevTimeStamp = currTimeStamp;
						}

						const dt = (currTimeStamp - prevTimeStamp)*0.001;
						prevTimeStamp = currTimeStamp;

						let keepGoing = false;
						try {
							keepGoing = exports.step(dt, odin_ctx);
						} catch (e) {
							crashed(e);
							return;
						}
						if (!keepGoing) {
							if (exports.shutdown) {
								exports.shutdown(dt, odin_ctx);
							}
							if (exports._end) {
								exports._end();
							}
							report("Program finished.\n");
							return;
						}

						window.requestAnimationFrame(step);
					}

					window.requestAnimationFrame(step);
				}
				window.parent.postMessage({type: "game-started"}, "*");
			}

			window.addEventListener("message", (e) => {
				if (e.data && e.data.type === "run") {
					run(e.data.wasm).catch(crashed);
				}
			});
			window.parent.postMessage({type: "game-ready"}, "*");
		</script>
	</body>
</html>
